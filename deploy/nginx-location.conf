# Insert inside the existing tool.vieapps.cloud HTTPS server block.
location = /streamforge { return 301 /streamforge/; }
location ^~ /streamforge/test/ {
    alias /opt/streamforge3/demo/;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /streamforge/ {
    proxy_pass http://127.0.0.1:8122/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 33m;
    client_body_buffer_size 40k;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}
